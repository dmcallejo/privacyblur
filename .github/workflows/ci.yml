name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test, build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # The code base still has many lint infos and warnings from the old rules; only
      # errors and warnings fail the build for now.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --exclude-tags benchmark
      - run: flutter build apk --debug --flavor foss -t lib/main_foss.dart

  benchmarks:
    name: Speed benchmarks (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags benchmark
